name: Verify RadarUa

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check data/feed.js
          node --check sw.js
          node --check worker/src/index.js
      - name: Test Telegram parser and release files
        run: |
          python -m unittest -v telegram-bridge/test_parser.py
          python -m py_compile telegram-bridge/bridge.py telegram-bridge/parser.py telegram-bridge/login.py
          python tools/check_release.py
