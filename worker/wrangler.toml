name = "radarua-api"
main = "src/index.js"
compatibility_date = "2026-08-28"

[vars]
ALLOWED_ORIGIN = "*"
# Optional comma-separated allowlist, e.g. "kpszsu,monitoringwar". Leave empty while setting up.
SOURCE_ALLOWLIST = ""

[[durable_objects.bindings]]
name = "RADAR_HUB"
class_name = "RadarHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RadarHub"]

# Create once: npx wrangler kv namespace create SUBSCRIPTIONS
[[kv_namespaces]]
binding = "SUBSCRIPTIONS"
id = "REPLACE_WITH_KV_ID"
