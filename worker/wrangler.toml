name = "radarua-api"
main = "src/index.js"
compatibility_date = "2026-08-27"

[vars]
CACHE_SECONDS = "15"
ALLOWED_ORIGIN = "*"

# Після `npx wrangler kv namespace create SUBSCRIPTIONS`
# вставте отриманий id замість REPLACE_WITH_KV_ID.
[[kv_namespaces]]
binding = "SUBSCRIPTIONS"
id = "REPLACE_WITH_KV_ID"

[triggers]
crons = ["*/1 * * * *"]
