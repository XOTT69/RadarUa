name = "radarua-api"
main = "src/index.js"
compatibility_date = "2026-08-27"

[vars]
ALLOWED_ORIGIN = "*"

[[durable_objects.bindings]]
name = "RADAR_HUB"
class_name = "RadarHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RadarHub"]

# Створіть KV: npx wrangler kv namespace create SUBSCRIPTIONS
[[kv_namespaces]]
binding = "SUBSCRIPTIONS"
id = "REPLACE_WITH_KV_ID"

[triggers]
crons = ["*/1 * * * *"]
